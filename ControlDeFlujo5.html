<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Switch Case sin Break</title>
</head>
<body>

    <script>
        // Corrección: Uso de 'let' en lugar de 'var' (estándar moderno)
        let grade = 'A';

        document.write("Entering switch block<br />");

        // DIFERENCIA PRINCIPAL CON EL CÓDIGO ANTERIOR:
        // Se eliminaron todas las sentencias 'break;'.
        // Comportamiento de "Fall-through": al no haber 'break', una vez que se encuentra 
        // la primera coincidencia (case 'A'), JavaScript ejecutará esa instrucción y CONTINUARÁ 
        // ejecutando automáticamente todos los casos siguientes, incluyendo el 'default', sin evaluar las condiciones.
        switch (grade) {
            case 'A':
                document.write("Good job<br />");
                // DIFERENCIA: Falta 'break;'. Al coincidir con 'A', la ejecución cae al caso 'B'.

            case 'B':
                document.write("Pretty good<br />");
                // DIFERENCIA: Falta 'break;'. Continúa la ejecución en cascada hacia 'C'.

            case 'C':
                document.write("Passed<br />");
                // DIFERENCIA: Falta 'break;'. Continúa hacia 'D'.

            case 'D':
                document.write("Not so good<br />");
                // DIFERENCIA: Falta 'break;'. Continúa hacia 'F'.

            case 'F':
                document.write("Failed<br />");
                // DIFERENCIA: Falta 'break;'. Continúa hacia 'default'.

            default:
                document.write("Unknown grade<br />")
        }

        document.write("Exiting switch block");
    </script>

    <p>Set the variable to different value and then try...</p>
</body>
</html>
