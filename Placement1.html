<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Define la codificación de caracteres para evitar problemas con acentos o caracteres especiales -->
  <meta charset="UTF-8">
  <title>Ejemplo JS</title>

  <!-- Etiqueta para incluir código JavaScript -->
  <script>
    // Función que muestra una ventana de alerta
    function sayHello() {
      alert("Hello World");
    }
  </script>
</head>
<body>

  <!-- Texto visible en la página -->
  <p>Click here for the result</p>

  <!-- Botón que ejecuta la función sayHello() al hacer clic -->
  <input type="button" onclick="sayHello()" value="Say Hello" />

</body>
</html>
