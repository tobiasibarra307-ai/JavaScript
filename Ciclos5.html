<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de Control de Bucles con Break</title>
</head>
<body>

    <script>
        // Declaración moderna de variable con 'let' en lugar de 'var'
        let x = 1;

        // Imprime el mensaje inicial antes de entrar al bucle
        document.write("Entering the loop<br /> ");

        // Bucle while: en teoría se repetiría mientras x sea menor a 20
        while (x < 20) {
            
            // Evaluamos si el contador llegó a 5
            if (x == 5) {
                // Sentencia break: interrumpe y sale inmediatamente del bucle while
                // Ignora todo el código restante dentro de la vuelta y no vuelve a evaluar la condición
                break;
            }

            // Incremento del contador (forma equivalente y moderna a x = x + 1 sería x++)
            x = x + 1;

            // Imprime el valor actualizado de x (comienza imprimiendo 2 y finaliza imprimiendo 5)
            document.write(x + "<br />");
        }

        // Se ejecuta una vez que se sale del bucle (ya sea por break o por terminar la condición)
        document.write("Exiting the loop!<br /> ");
    </script>

    <p>Set the variable to different value and then try...</p>
</body>
</html>
